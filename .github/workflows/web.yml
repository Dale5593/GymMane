name: Web app (iPhone PWA)

on:
  push:
    branches: [main, pwa]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  build:
    name: Build web app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build
        run: |
          set -o pipefail
          {
            flutter --version
            flutter pub get
            echo "::group::analyze"
            flutter analyze --no-fatal-infos --no-fatal-warnings lib || true
            echo "::endgroup::"
            flutter build web --release --no-web-resources-cdn \
              --base-href "/${{ github.event.repository.name }}/"
          } 2>&1 | tee build.log

      - name: Offline cache list
        run: python3 tool/web/make_sw.py build/web | tee -a build.log

      # Lets the build log be read without Actions access: it is pushed to the
      # ci-log branch on every run.
      - name: Publish build log
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/log"
          cp build.log "$RUNNER_TEMP/log/" 2>/dev/null || echo "no build log" > "$RUNNER_TEMP/log/build.log"
          echo "${{ job.status }} ${{ github.ref_name }} $GITHUB_SHA" > "$RUNNER_TEMP/log/status.txt"
          cd "$RUNNER_TEMP/log"
          git init -q && git checkout -q -b ci-log && git add .
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Build log for $GITHUB_SHA"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-log

      # A copy of the built site on the web-build branch, for testing.
      - name: Publish build output
        if: success()
        run: |
          cd build/web
          git init -q && git checkout -q -b web-build && git add .
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Web build of $GITHUB_SHA"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" web-build
          rm -rf .git

      - name: Upload site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Publish to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
